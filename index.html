<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCSQUAD - FC 온라인 전적 & 스쿼드 검색</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
        <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-black text-xl tracking-tighter shadow-md shadow-emerald-200">
          FC
        </div>
        <span class="text-xl font-extrabold tracking-tight text-slate-900">
          FC<span class="text-emerald-600">SQUAD</span>
        </span>
      </div>

      <!-- Quick Links -->
      <div class="flex items-center gap-3 text-xs font-semibold text-slate-500">
        <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full border border-emerald-200">
          ● API LIVE
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- Hero & Search Section -->
    <section class="text-center my-6 max-w-2xl mx-auto">
      <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl tracking-tight">
        구단주 전적 & 스쿼드 검색
      </h1>
      <p class="text-slate-500 mt-2 text-sm">
        상대방 및 내 구단의 포메이션, 팀컬러, 선수 시세, 강화 정보를 한눈에 확인하세요.
      </p>

      <!-- Search Input Box -->
      <div class="mt-6 relative">
        <form id="searchForm" onsubmit="handleSearch(event)" class="flex gap-2">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              type="text" 
              id="nicknameInput"
              placeholder="구단주 닉네임을 입력하세요 (예: 넥슨구단주)" 
              class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-300 rounded-2xl text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent shadow-sm transition"
              required
            />
          </div>
          <button 
            type="submit" 
            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3.5 rounded-2xl shadow-md shadow-emerald-100 transition flex items-center gap-2 text-sm whitespace-nowrap"
          >
            <span>검색</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- Recent Searches Tags -->
        <div id="recentSearches" class="flex flex-wrap items-center gap-2 mt-3 text-xs text-slate-500 justify-start">
          <span class="font-medium text-slate-400">최근 검색:</span>
          <div id="recentTags" class="flex flex-wrap gap-1.5"></div>
        </div>
      </div>
    </section>

    <!-- Loading State Spinner -->
    <div id="loadingSpinner" class="hidden py-16 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-600 border-t-transparent"></div>
      <p class="text-slate-500 font-medium mt-4 text-sm">넥슨 오픈 API 데이터 조회 중...</p>
    </div>

    <!-- Error View -->
    <div id="errorMessage" class="hidden my-8 p-4 bg-red-50 border border-red-200 rounded-2xl text-red-600 text-center text-sm font-medium">
      <span id="errorText">구단주를 찾을 수 없습니다.</span>
    </div>

    <!-- Search Results View -->
    <div id="resultContainer" class="hidden space-y-6">
      
      <!-- User Summary Banner -->
      <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 bg-slate-100 border border-slate-200 rounded-2xl flex items-center justify-center text-slate-700 font-black text-2xl shadow-inner">
            <i data-lucide="user" class="w-8 h-8 text-slate-400"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="userNickname" class="text-2xl font-bold text-slate-900">구단주명</h2>
              <span id="userLevel" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-semibold border border-slate-200">
                Lv.100
              </span>
            </div>
            <p id="userMaxDiv" class="text-xs text-slate-500 font-medium mt-1">
              최고 등급: 월드클래스 1부
            </p>
          </div>
        </div>

        <!-- Recent Match Result Badge -->
        <div id="matchSummary" class="flex items-center gap-4 bg-slate-50 px-5 py-3 rounded-2xl border border-slate-200/80">
          <div class="text-right">
            <div class="text-xs text-slate-400 font-medium">최근 경기 결과</div>
            <div id="matchScore" class="text-lg font-black text-slate-800">2 : 1</div>
          </div>
          <div id="matchBadge" class="bg-emerald-600 text-white font-extrabold text-xs px-3 py-1.5 rounded-xl shadow-sm">
            승리
          </div>
        </div>
      </div>

      <!-- Squad Switcher Tabs & Info Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
        <!-- Tabs -->
        <div class="flex bg-slate-200/70 p-1 rounded-2xl w-fit">
          <button 
            id="tabMy" 
            onclick="switchSquad('my')"
            class="px-5 py-2 rounded-xl text-xs font-bold transition shadow-sm bg-white text-slate-900"
          >
            내 스쿼드
          </button>
          <button 
            id="tabOpp" 
            onclick="switchSquad('opponent')"
            class="px-5 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900"
          >
            상대방 스쿼드
          </button>
        </div>

        <!-- Squad Summary Metadata (Formation, Team Color, Value) -->
        <div class="flex flex-wrap items-center gap-3 text-xs">
          <div class="bg-white border border-slate-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
            <span class="text-slate-400">포메이션:</span>
            <span id="squadFormation" class="font-bold text-slate-800">4-2-3-1</span>
          </div>
          <div class="bg-white border border-slate-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
            <span class="text-slate-400">구단가치:</span>
            <span id="squadValue" class="font-bold text-emerald-600">0 BP</span>
          </div>
        </div>
      </div>

      <!-- Team Color Badges -->
      <div id="teamColorContainer" class="flex flex-wrap gap-2">
        <!-- JS로 팀컬러 배지 동적 삽입 -->
      </div>

      <!-- Squad Player Cards Grid -->
      <div id="playerGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
        <!-- JS로 선수 카드 동적 삽입 -->
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12">
    <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-400 space-y-1">
      <p>Data based on NEXON Open API</p>
      <p>© 2026 FCSQUAD. All rights reserved.</p>
    </div>
  </footer>

  <!-- Main JavaScript Code -->
  <script>
    let currentMatchData = null;
    let currentTab = 'my';

    // 아이콘 초기화
    lucide.createIcons();
    loadRecentSearches();

    // 최근 검색어 불러오기
    function loadRecentSearches() {
      const tags = JSON.parse(localStorage.getItem('fcsquad_recent') || '["넥슨구단주", "손흥민"]');
      const container = document.getElementById('recentTags');
      container.innerHTML = tags.map(tag => `
        <button onclick="executeSearch('${tag}')" class="bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 px-2.5 py-1 rounded-lg text-xs font-medium transition">
          ${tag}
        </button>
      `).join('');
    }

    // 최근 검색어 저장
    function saveRecentSearch(nickname) {
      let tags = JSON.parse(localStorage.getItem('fcsquad_recent') || '[]');
      tags = [nickname, ...tags.filter(t => t !== nickname)].slice(0, 5);
      localStorage.setItem('fcsquad_recent', JSON.stringify(tags));
      loadRecentSearches();
    }

    // 검색 실행 (클릭 처리)
    function executeSearch(nickname) {
      document.getElementById('nicknameInput').value = nickname;
      handleSearch(new Event('submit'));
    }

    // 전적 검색 메인 로직
    async function handleSearch(e) {
      if (e) e.preventDefault();
      const nickname = document.getElementById('nicknameInput').value.trim();
      if (!nickname) return;

      const spinner = document.getElementById('loadingSpinner');
      const errorMsg = document.getElementById('errorMessage');
      const resultView = document.getElementById('resultContainer');

      spinner.classList.remove('hidden');
      errorMsg.classList.add('hidden');
      resultView.classList.add('hidden');

      try {
        // Vercel Serverless Function 호출
        const response = await fetch(`/api/search?nickname=${encodeURIComponent(nickname)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '유저 정보를 불러올 수 없습니다.');
        }

        saveRecentSearch(nickname);
        renderData(data);
        spinner.classList.add('hidden');
        resultView.classList.remove('hidden');

      } catch (err) {
        spinner.classList.add('hidden');
        errorMsg.classList.remove('hidden');
        document.getElementById('errorText').innerText = err.message || '검색 중 오류가 발생했습니다.';
      }
    }

    // API 데이터 랜더링
    function renderData(data) {
      // 1. 유저 헤더
      document.getElementById('userNickname').innerText = data.user.nickname;
      document.getElementById('userLevel').innerText = `Lv.${data.user.level}`;
      document.getElementById('userMaxDiv').innerText = `최고 등급: ${data.user.maxDivision}`;

      // 2. 매치 결과
      if (data.matchInfo) {
        currentMatchData = data.matchInfo;
        const my = data.matchInfo.my;
        const opp = data.matchInfo.opponent;

        document.getElementById('matchScore').innerText = `${my.score} : ${opp.score}`;
        const badge = document.getElementById('matchBadge');
        if (my.result === '승') {
          badge.innerText = '승리';
          badge.className = 'bg-emerald-600 text-white font-extrabold text-xs px-3 py-1.5 rounded-xl shadow-sm';
        } else if (my.result === '패') {
          badge.innerText = '패배';
          badge.className = 'bg-rose-500 text-white font-extrabold text-xs px-3 py-1.5 rounded-xl shadow-sm';
        } else {
          badge.innerText = '무승부';
          badge.className = 'bg-slate-500 text-white font-extrabold text-xs px-3 py-1.5 rounded-xl shadow-sm';
        }

        switchSquad('my');
      }
    }

    // 스쿼드 탭 전환 (내 스쿼드 vs 상대방 스쿼드)
    function switchSquad(type) {
      currentTab = type;
      const tabMy = document.getElementById('tabMy');
      const tabOpp = document.getElementById('tabOpp');

      if (type === 'my') {
        tabMy.className = 'px-5 py-2 rounded-xl text-xs font-bold transition shadow-sm bg-white text-slate-900';
        tabOpp.className = 'px-5 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900';
      } else {
        tabOpp.className = 'px-5 py-2 rounded-xl text-xs font-bold transition shadow-sm bg-white text-slate-900';
        tabMy.className = 'px-5 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900';
      }

      if (!currentMatchData) return;
      const squadData = currentMatchData[type];

      // 포메이션 및 가치 업데이트
      document.getElementById('squadFormation').innerText = squadData.formation;
      document.getElementById('squadValue').innerText = formatBP(squadData.squadValue);

      // 팀컬러 배지 출력
      const tcContainer = document.getElementById('teamColorContainer');
      tcContainer.innerHTML = squadData.teamColors.map(tc => `
        <span class="bg-emerald-50 text-emerald-700 border border-emerald-200/80 font-semibold text-xs px-3 py-1 rounded-xl flex items-center gap-1">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> ${tc}
        </span>
      `).join('');

      // 선수 카드 그리드 출력
      const grid = document.getElementById('playerGrid');
      grid.innerHTML = squadData.players.map(p => {
        const gradeColor = getGradeBadgeColor(p.grade);
        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 flex flex-col items-center hover:border-emerald-500 transition shadow-sm relative overflow-hidden group">
            <!-- Position & Season Badge -->
            <div class="w-full flex items-center justify-between text-[11px] font-bold mb-1">
              <span class="text-slate-500">${p.position}</span>
              <span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded text-[10px] border border-slate-200">${p.season}</span>
            </div>

            <!-- Player Image & Grade Badge -->
            <div class="relative w-16 h-16 my-1">
              <img 
                src="${p.img}" 
                alt="${p.name}" 
                class="w-full h-full object-contain filter drop-shadow-sm" 
                onerror="this.src='https://fconline.nexon.com/data/player/default.png'"
              />
              <span class="${gradeColor} text-white font-black text-[10px] px-1.5 py-0.2 rounded-md absolute bottom-0 right-0 shadow-sm">
                +${p.grade}
              </span>
            </div>

            <!-- Player Name -->
            <div class="font-bold text-xs text-slate-900 truncate w-full text-center mt-1">
              ${p.name}
            </div>

            <!-- Player Price -->
            <div class="text-[11px] font-semibold text-emerald-600 mt-0.5">
              ${formatBP(p.price)}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // BP 금액 가독성 포맷 (억/조 단위 연산)
    function formatBP(value) {
      if (!value) return '0 BP';
      if (value >= 1000000000000) {
        return (value / 1000000000000).toFixed(1) + '조 BP';
      } else if (value >= 100000000) {
        return (value / 100000000).toFixed(0) + '억 BP';
      }
      return value.toLocaleString() + ' BP';
    }

    // 강화 단계별 색상 지정 (+1~4: 동/기본, +5~7: 은카, +8~10: 금카)
    function getGradeBadgeColor(grade) {
      if (grade >= 8) return 'bg-amber-400 text-slate-900'; // 금카
      if (grade >= 5) return 'bg-slate-300 text-slate-800'; // 은카
      return 'bg-amber-700'; // 동카/기본
    }
  </script>
</body>
</html>
